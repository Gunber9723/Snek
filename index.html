<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>เกมงูกินหาง</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0f0f1a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Segoe UI', sans-serif;
      color: #fff;
      padding: 10px 0 20px;
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 8px;
      color: #4eff91;
      text-shadow: 0 0 12px #4eff91;
      letter-spacing: 2px;
    }

    #scoreboard {
      display: flex;
      gap: 36px;
      margin-bottom: 12px;
    }

    .score-box { text-align: center; }
    .score-label { font-size: 0.72rem; color: #aaa; text-transform: uppercase; letter-spacing: 1px; }
    .score-value { font-size: 1.5rem; font-weight: bold; color: #fff; }

    #gameWrapper { position: relative; }

    canvas {
      display: block;
      border-radius: 6px;
      box-shadow: 0 0 24px #4eff9155;
      background: #111122;
      border: 2px solid #4eff91;
    }

    /* ===== OVERLAY ===== */
    #overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(10,10,20,0.88);
      border-radius: 6px;
      gap: 12px;
      overflow-y: auto;
      padding: 16px;
    }

    /* ===== STAGE SELECT ===== */
    #stageScreen { display: flex; flex-direction: column; align-items: center; gap: 10px; width: 100%; }

    #stageScreen h2 {
      font-size: 1.4rem;
      color: #4eff91;
      text-shadow: 0 0 10px #4eff91;
      letter-spacing: 1px;
    }

    #stageGrid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      width: 100%;
      max-width: 360px;
    }

    .stage-card {
      background: #1a1a2e;
      border: 2px solid #2a2a50;
      border-radius: 10px;
      padding: 10px 12px;
      cursor: pointer;
      transition: border-color 0.2s, transform 0.15s, box-shadow 0.2s;
      text-align: left;
    }

    .stage-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }

    .stage-card.locked {
      opacity: 0.45;
      cursor: not-allowed;
      filter: grayscale(60%);
    }

    .stage-card .s-icon { font-size: 1.6rem; margin-bottom: 4px; }
    .stage-card .s-name { font-size: 0.85rem; font-weight: bold; margin-bottom: 2px; }
    .stage-card .s-desc { font-size: 0.68rem; color: #bbb; margin-bottom: 4px; line-height: 1.3; }
    .stage-card .s-diff { font-size: 0.7rem; }

    .stage-card[data-stage="1"] { border-color: #4eff91; box-shadow: 0 0 8px #4eff9133; }
    .stage-card[data-stage="2"] { border-color: #4ecbff; }
    .stage-card[data-stage="3"] { border-color: #ffd04e; }
    .stage-card[data-stage="4"] { border-color: #c04eff; }
    .stage-card[data-stage="5"] { border-color: #ff4e4e; }

    .stage-card[data-stage="1"]:hover { box-shadow: 0 0 18px #4eff9166; }
    .stage-card[data-stage="2"]:hover { box-shadow: 0 0 18px #4ecbff66; }
    .stage-card[data-stage="3"]:hover { box-shadow: 0 0 18px #ffd04e66; }
    .stage-card[data-stage="4"]:hover { box-shadow: 0 0 18px #c04eff66; }
    .stage-card[data-stage="5"]:hover { box-shadow: 0 0 18px #ff4e4e66; }

    .lock-label { font-size: 0.65rem; color: #888; margin-top: 2px; }
    .highrow { font-size: 0.65rem; color: #aaa; margin-top: 2px; }

    /* ===== GAME OVER / START ===== */
    #gameOverScreen { display: none; flex-direction: column; align-items: center; gap: 12px; }
    #gameOverScreen h2 { font-size: 1.8rem; }

    .go-info { font-size: 0.9rem; color: #ccc; }
    .go-score { font-size: 1.3rem; color: #4eff91; font-weight: bold; }
    .go-hi    { font-size: 0.85rem; color: #ffd04e; }
    .go-stage { font-size: 0.8rem; color: #aaa; margin-top: -4px; }

    .btn-row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }

    button {
      padding: 9px 26px;
      font-size: 0.95rem;
      background: #4eff91;
      color: #0f0f1a;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      font-weight: bold;
      transition: transform 0.1s, box-shadow 0.1s;
      box-shadow: 0 0 12px #4eff9177;
    }

    button:hover { transform: scale(1.05); box-shadow: 0 0 20px #4eff91aa; }

    button.btn-secondary {
      background: #1e1e30;
      color: #4eff91;
      border: 1px solid #4eff9155;
      box-shadow: none;
    }

    button.btn-secondary:hover { background: #2a2a44; box-shadow: 0 0 10px #4eff9133; }

    /* ===== BOTTOM CONTROLS ===== */
    #bottomBar {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-top: 10px;
    }

    #speedRow {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      color: #aaa;
    }

    #speedSelect {
      background: #1e1e30;
      color: #4eff91;
      border: 1px solid #4eff9155;
      border-radius: 6px;
      padding: 4px 8px;
      font-size: 0.85rem;
      cursor: pointer;
    }

    #muteBtn {
      background: #1e1e30;
      border: 1px solid #4eff9155;
      color: #4eff91;
      border-radius: 8px;
      width: 36px; height: 36px;
      font-size: 1.1rem;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      padding: 0;
      box-shadow: none;
    }

    #muteBtn:hover { background: #2a2a44; }

    #controls {
      margin-top: 10px;
      display: grid;
      grid-template-columns: repeat(3, 44px);
      grid-template-rows: repeat(2, 44px);
      gap: 5px;
    }

    .ctrl-btn {
      width: 44px; height: 44px;
      background: #1e1e30;
      border: 1px solid #4eff9155;
      border-radius: 8px;
      color: #4eff91;
      font-size: 1.1rem;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      user-select: none;
      transition: background 0.1s;
    }

    .ctrl-btn:active { background: #2e2e50; }

    #ctrl-up    { grid-column: 2; grid-row: 1; }
    #ctrl-left  { grid-column: 1; grid-row: 2; }
    #ctrl-down  { grid-column: 2; grid-row: 2; }
    #ctrl-right { grid-column: 3; grid-row: 2; }

    /* ===== STAGE BANNER ===== */
    #stageBanner {
      font-size: 0.75rem;
      color: #aaa;
      margin-bottom: 4px;
      letter-spacing: 0.5px;
    }

    #stageBanner span { font-weight: bold; }

    /* ===== LEVEL UP FLASH ===== */
    #levelFlash {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      border-radius: 6px;
      font-size: 2rem;
      font-weight: bold;
      color: #ffd04e;
      text-shadow: 0 0 20px #ffd04e;
      opacity: 0;
      transition: opacity 0.3s;
    }

    /* ===== BOSS ALERT ===== */
    #bossAlert {
      position: absolute;
      top: 8px; left: 50%; transform: translateX(-50%);
      background: rgba(255,60,60,0.9);
      color: #fff;
      font-size: 0.75rem;
      font-weight: bold;
      padding: 3px 14px;
      border-radius: 20px;
      pointer-events: none;
      white-space: nowrap;
      box-shadow: 0 0 12px #ff3c3c;
      opacity: 0;
      transition: opacity 0.3s;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>

  <h1>🐍 งูกินหาง</h1>

  <div id="scoreboard">
    <div class="score-box">
      <div class="score-label">คะแนน</div>
      <div class="score-value" id="scoreDisplay">0</div>
    </div>
    <div class="score-box">
      <div class="score-label">สูงสุด</div>
      <div class="score-value" id="highDisplay">0</div>
    </div>
    <div class="score-box">
      <div class="score-label">ระดับ</div>
      <div class="score-value" id="levelDisplay">1</div>
    </div>
  </div>

  <div id="stageBanner">ด่าน: <span id="stageNameDisplay">-</span></div>

  <div id="gameWrapper">
    <canvas id="gameCanvas" width="400" height="400"></canvas>
    <div id="levelFlash"></div>
    <div id="bossAlert">👑 บอสโผล่แล้ว! x3 คะแนน!</div>

    <div id="overlay">

      <!-- Stage Select -->
      <div id="stageScreen">
        <h2>🗺️ เลือกด่าน</h2>
        <div id="stageGrid">
          <!-- filled by JS -->
        </div>
      </div>

      <!-- Game Over -->
      <div id="gameOverScreen">
        <h2 id="goTitle">💀 เกมจบแล้ว!</h2>
        <div class="go-stage" id="goStage"></div>
        <div class="go-score" id="goScore"></div>
        <div class="go-hi"   id="goHi"></div>
        <div class="btn-row">
          <button id="retryBtn">เล่นอีกครั้ง</button>
          <button class="btn-secondary" id="backBtn">เลือกด่าน</button>
        </div>
      </div>

    </div>
  </div>

  <div id="bottomBar">
    <div id="speedRow">
      <label for="speedSelect">ความเร็ว:</label>
      <select id="speedSelect">
        <option value="200">ช้า</option>
        <option value="130" selected>ปกติ</option>
        <option value="80">เร็ว</option>
        <option value="50">เร็วมาก</option>
      </select>
    </div>
    <button id="muteBtn" title="เปิด/ปิดเสียง">🔊</button>
  </div>

  <div id="controls">
    <div class="ctrl-btn" id="ctrl-up">▲</div>
    <div class="ctrl-btn" id="ctrl-left">◀</div>
    <div class="ctrl-btn" id="ctrl-down">▼</div>
    <div class="ctrl-btn" id="ctrl-right">▶</div>
  </div>

<script>
/* ===================== CANVAS SETUP ===================== */
const canvas  = document.getElementById('gameCanvas');
const ctx     = canvas.getContext('2d');
const COLS = 20, ROWS = 20;
const CELL = canvas.width / COLS;

/* ===================== STAGE DEFINITIONS ===================== */
const STAGES = [
  {
    id: 1,
    name: 'ทุ่งหญ้า',
    icon: '🌿',
    desc: 'ไม่มีสิ่งกีดขวาง เหมาะสำหรับมือใหม่',
    diff: '⭐',
    color: '#4eff91',
    bgColor: '#0d1a12',
    gridColor: 'rgba(78,255,145,0.04)',
    snakeHead: '#4eff91',
    snakeBody: [0, 200, 80],
    foodColor: '#ff4e4e',
    wallColor: null,
    wrapAround: false,
    obstacles: [],
    baseSpeed: null,
    unlockScore: 0,
  },
  {
    id: 2,
    name: 'ป่าทึบ',
    icon: '🌲',
    desc: 'มีต้นไม้กลางแผนที่ ต้องหลบ',
    diff: '⭐⭐',
    color: '#4ecbff',
    bgColor: '#0d1318',
    gridColor: 'rgba(78,203,255,0.04)',
    snakeHead: '#4ecbff',
    snakeBody: [0, 150, 200],
    foodColor: '#ffaa4e',
    wallColor: '#2d5a27',
    wrapAround: false,
    obstacles: buildForestObs(),
    baseSpeed: null,
    unlockScore: 0,
  },
  {
    id: 3,
    name: 'ทะเลทราย',
    icon: '🏜️',
    desc: 'หินผาขวางทางทั้งสองฝั่ง',
    diff: '⭐⭐⭐',
    color: '#ffd04e',
    bgColor: '#1a1508',
    gridColor: 'rgba(255,208,78,0.04)',
    snakeHead: '#ffd04e',
    snakeBody: [160, 120, 0],
    foodColor: '#ff6b6b',
    wallColor: '#8b6914',
    wrapAround: false,
    obstacles: buildDesertObs(),
    baseSpeed: null,
    unlockScore: 0,
  },
  {
    id: 4,
    name: 'อวกาศ',
    icon: '🚀',
    desc: 'ทะลุกำแพงได้ แต่ต้องระวังตัวเอง',
    diff: '⭐⭐⭐',
    color: '#c04eff',
    bgColor: '#0f0a1a',
    gridColor: 'rgba(192,78,255,0.04)',
    snakeHead: '#c04eff',
    snakeBody: [120, 0, 200],
    foodColor: '#ffdd4e',
    wallColor: '#3a1f5e',
    wrapAround: true,
    obstacles: buildSpaceObs(),
    baseSpeed: null,
    unlockScore: 0,
  },
  {
    id: 5,
    name: 'นรก',
    icon: '🔥',
    desc: 'เร็วมาก! สิ่งกีดขวางเต็มไปหมด',
    diff: '⭐⭐⭐⭐⭐',
    color: '#ff4e4e',
    bgColor: '#1a0808',
    gridColor: 'rgba(255,78,78,0.05)',
    snakeHead: '#ff4e4e',
    snakeBody: [200, 30, 0],
    foodColor: '#ffff00',
    wallColor: '#7a1010',
    wrapAround: false,
    obstacles: buildHellObs(),
    baseSpeed: 70,
    unlockScore: 0,
  },
];

function buildForestObs() {
  const obs = [];
  const trees = [[9,9],[10,9],[9,10],[10,10],[9,8],[10,8],[8,9],[11,9]];
  trees.forEach(([x,y]) => obs.push({x,y}));
  return obs;
}

function buildDesertObs() {
  const obs = [];
  for (let y = 3; y <= 7; y++)  obs.push({x:4, y});
  for (let y = 12; y <= 16; y++) obs.push({x:15, y});
  for (let x = 7; x <= 9; x++)  obs.push({x, y:14});
  for (let x = 11; x <= 13; x++) obs.push({x, y:5});
  return obs;
}

function buildSpaceObs() {
  const obs = [];
  const pts = [[5,5],[14,5],[5,14],[14,14],[9,4],[10,4],[4,9],[4,10],[15,9],[15,10],[9,15],[10,15]];
  pts.forEach(([x,y]) => obs.push({x,y}));
  return obs;
}

function buildHellObs() {
  const obs = [];
  const pts = [
    [3,3],[4,3],[3,4],
    [16,3],[15,3],[16,4],
    [3,16],[4,16],[3,15],
    [16,16],[15,16],[16,15],
    [9,2],[10,2],[9,17],[10,17],
    [2,9],[2,10],[17,9],[17,10],
    [6,6],[7,6],[6,7],
    [13,6],[12,6],[13,7],
    [6,13],[7,13],[6,12],
    [13,13],[12,13],[13,12],
    [9,9],[10,9],[9,10],[10,10],
  ];
  pts.forEach(([x,y]) => obs.push({x,y}));
  return obs;
}

/* ===================== SOUND ENGINE ===================== */
let audioCtx = null;
let muted = false;

function getAudioCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}

function playTone(freq, type, duration, vol = 0.3, delay = 0) {
  if (muted) return;
  try {
    const ac = getAudioCtx();
    const osc = ac.createOscillator();
    const gain = ac.createGain();
    osc.connect(gain);
    gain.connect(ac.destination);
    osc.type = type;
    osc.frequency.setValueAtTime(freq, ac.currentTime + delay);
    gain.gain.setValueAtTime(vol, ac.currentTime + delay);
    gain.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + delay + duration);
    osc.start(ac.currentTime + delay);
    osc.stop(ac.currentTime + delay + duration + 0.05);
  } catch(e) {}
}

function soundEat() {
  playTone(880, 'sine', 0.08, 0.25);
  playTone(1100, 'sine', 0.08, 0.2, 0.06);
}

function soundDie() {
  playTone(300, 'sawtooth', 0.12, 0.3);
  playTone(200, 'sawtooth', 0.12, 0.3, 0.1);
  playTone(120, 'sawtooth', 0.2,  0.3, 0.22);
}

function soundLevelUp() {
  [523, 659, 784, 1047].forEach((f, i) => {
    playTone(f, 'sine', 0.12, 0.25, i * 0.1);
  });
}

function soundStart() {
  [330, 440, 550].forEach((f, i) => {
    playTone(f, 'triangle', 0.1, 0.2, i * 0.08);
  });
}

function soundSelect() {
  playTone(660, 'sine', 0.08, 0.18);
}

function soundBossAppear() {
  playTone(200, 'sawtooth', 0.06, 0.2);
  playTone(300, 'sawtooth', 0.06, 0.2, 0.07);
  playTone(450, 'square',   0.1,  0.25, 0.14);
  playTone(600, 'square',   0.12, 0.3,  0.22);
}

function soundBossEat() {
  [1047, 1319, 1568, 2093].forEach((f, i) => {
    playTone(f, 'sine', 0.15, 0.35, i * 0.07);
  });
  playTone(300, 'triangle', 0.25, 0.2, 0.1);
}

function soundBossExpire() {
  playTone(400, 'sawtooth', 0.08, 0.15);
  playTone(250, 'sawtooth', 0.12, 0.15, 0.1);
}

/* ===================== UI ELEMENTS ===================== */
const overlay       = document.getElementById('overlay');
const stageScreen   = document.getElementById('stageScreen');
const gameOverScreen= document.getElementById('gameOverScreen');
const scoreEl       = document.getElementById('scoreDisplay');
const highEl        = document.getElementById('highDisplay');
const levelEl       = document.getElementById('levelDisplay');
const speedSelect   = document.getElementById('speedSelect');
const muteBtn       = document.getElementById('muteBtn');
const levelFlash    = document.getElementById('levelFlash');
const stageNameDisp = document.getElementById('stageNameDisplay');
const stageGrid     = document.getElementById('stageGrid');

const retryBtn   = document.getElementById('retryBtn');
const backBtn    = document.getElementById('backBtn');
const goTitle    = document.getElementById('goTitle');
const goStage    = document.getElementById('goStage');
const goScore    = document.getElementById('goScore');
const goHi       = document.getElementById('goHi');
const bossAlertEl= document.getElementById('bossAlert');

/* ===================== HIGH SCORES ===================== */
function getHighScore(stageId) {
  return parseInt(localStorage.getItem(`snakeHigh_s${stageId}`) || '0');
}
function setHighScore(stageId, val) {
  localStorage.setItem(`snakeHigh_s${stageId}`, val);
}
function getGlobalHigh() {
  return Math.max(...STAGES.map(s => getHighScore(s.id)));
}

/* ===================== BUILD STAGE CARDS ===================== */
function buildStageCards() {
  stageGrid.innerHTML = '';
  STAGES.forEach(s => {
    const hi = getHighScore(s.id);
    const card = document.createElement('div');
    card.className = 'stage-card';
    card.dataset.stage = s.id;
    card.innerHTML = `
      <div class="s-icon">${s.icon}</div>
      <div class="s-name" style="color:${s.color}">${s.name}</div>
      <div class="s-desc">${s.desc}</div>
      <div class="s-diff">${s.diff}</div>
      ${hi > 0 ? `<div class="highrow">สูงสุด: ${hi}</div>` : ''}
    `;
    card.addEventListener('click', () => {
      soundSelect();
      selectedStage = s;
      startGame();
    });
    stageGrid.appendChild(card);
  });
}

/* ===================== GAME STATE ===================== */
let snake, dir, nextDir, food, score, level, gameLoop, running;
let selectedStage = STAGES[0];
let currentObstacles = [];

/* Boss food state */
let bossFood = null;       // {x, y} or null
let foodCount = 0;         // normal foods eaten this game
let bossLifetime = 0;      // ticks remaining before boss expires
let bossTick = 0;          // tick counter for boss movement
let bossAngle = 0;         // animation angle for glow pulse
const BOSS_EVERY   = 5;    // spawn boss every N normal foods
const BOSS_LIFE    = 60;   // ticks the boss food lives
const BOSS_MOVE_EVERY = 3; // boss moves every N ticks

let bossAlertTimer = null;

function showBossAlert() {
  bossAlertEl.style.opacity = '1';
  if (bossAlertTimer) clearTimeout(bossAlertTimer);
  bossAlertTimer = setTimeout(() => { bossAlertEl.style.opacity = '0'; }, 2200);
}

function hideBossAlert() {
  bossAlertEl.style.opacity = '0';
  if (bossAlertTimer) clearTimeout(bossAlertTimer);
}

function updateGlobalHigh() {
  highEl.textContent = getGlobalHigh();
}

function showStageSelect() {
  buildStageCards();
  updateGlobalHigh();
  stageScreen.style.display = 'flex';
  gameOverScreen.style.display = 'none';
  overlay.style.display = 'flex';
}

function showGameOver(win = false) {
  running = false;
  clearInterval(gameLoop);

  const hi = getHighScore(selectedStage.id);
  if (score > hi) {
    setHighScore(selectedStage.id, score);
    goHi.textContent = '🏆 สถิติใหม่! ' + score + ' คะแนน!';
    goHi.style.color = '#ffd04e';
  } else {
    goHi.textContent = `สถิติด่านนี้: ${Math.max(hi, score)}`;
    goHi.style.color = '#aaa';
  }

  updateGlobalHigh();
  soundDie();

  goTitle.textContent = '💀 เกมจบแล้ว!';
  goTitle.style.color = '#ff4e4e';
  goTitle.style.textShadow = '0 0 12px #ff4e4e';
  goStage.textContent = `${selectedStage.icon} ด่าน: ${selectedStage.name}`;
  goScore.textContent = `คะแนน: ${score}`;

  stageScreen.style.display = 'none';
  gameOverScreen.style.display = 'flex';
  overlay.style.display = 'flex';
}

/* ===================== RANDOM CELL ===================== */
function randCell() {
  let pos;
  do {
    pos = { x: Math.floor(Math.random() * COLS), y: Math.floor(Math.random() * ROWS) };
  } while (
    snake.some(s => s.x === pos.x && s.y === pos.y) ||
    currentObstacles.some(o => o.x === pos.x && o.y === pos.y) ||
    (bossFood && bossFood.x === pos.x && bossFood.y === pos.y)
  );
  return pos;
}

function randBossCell() {
  let pos;
  do {
    pos = { x: Math.floor(Math.random() * COLS), y: Math.floor(Math.random() * ROWS) };
  } while (
    snake.some(s => s.x === pos.x && s.y === pos.y) ||
    currentObstacles.some(o => o.x === pos.x && o.y === pos.y) ||
    (food && food.x === pos.x && food.y === pos.y)
  );
  return pos;
}

function spawnBossFood() {
  bossFood = randBossCell();
  bossLifetime = BOSS_LIFE;
  bossTick = 0;
  soundBossAppear();
  showBossAlert();
}

function moveBossFood() {
  const dirs = [{x:1,y:0},{x:-1,y:0},{x:0,y:1},{x:0,y:-1}];
  const shuffled = dirs.sort(() => Math.random() - 0.5);
  for (const d of shuffled) {
    const nx = bossFood.x + d.x;
    const ny = bossFood.y + d.y;
    if (nx < 0 || nx >= COLS || ny < 0 || ny >= ROWS) continue;
    if (currentObstacles.some(o => o.x === nx && o.y === ny)) continue;
    if (food.x === nx && food.y === ny) continue;
    bossFood = { x: nx, y: ny };
    return;
  }
}

/* ===================== INIT + START ===================== */
function initGame() {
  const mid = Math.floor(COLS / 2);
  snake = [{x:mid,y:mid},{x:mid-1,y:mid},{x:mid-2,y:mid}];
  dir = {x:1,y:0};
  nextDir = {x:1,y:0};
  score = 0;
  level = 1;
  scoreEl.textContent = 0;
  levelEl.textContent = 1;
  currentObstacles = selectedStage.obstacles.slice();
  stageNameDisp.textContent = `${selectedStage.icon} ${selectedStage.name}`;
  canvas.style.borderColor = selectedStage.color;
  canvas.style.boxShadow = `0 0 24px ${selectedStage.color}55`;
  bossFood = null;
  foodCount = 0;
  bossLifetime = 0;
  bossTick = 0;
  bossAngle = 0;
  hideBossAlert();
  food = randCell();
}

function getBaseSpeed() {
  return selectedStage.baseSpeed || parseInt(speedSelect.value);
}

function startGame() {
  initGame();
  overlay.style.display = 'none';
  running = true;
  clearInterval(gameLoop);
  soundStart();
  gameLoop = setInterval(tick, getBaseSpeed());
  draw();
}

/* ===================== TICK ===================== */
function tick() {
  dir = nextDir;
  let hx = snake[0].x + dir.x;
  let hy = snake[0].y + dir.y;

  if (selectedStage.wrapAround) {
    hx = (hx + COLS) % COLS;
    hy = (hy + ROWS) % ROWS;
  } else {
    if (hx < 0 || hx >= COLS || hy < 0 || hy >= ROWS) return showGameOver();
  }

  const head = {x:hx, y:hy};

  if (snake.some(s => s.x === head.x && s.y === head.y)) return showGameOver();
  if (currentObstacles.some(o => o.x === head.x && o.y === head.y)) return showGameOver();

  snake.unshift(head);

  let ate = false;

  /* --- eat normal food --- */
  if (head.x === food.x && head.y === food.y) {
    score += 10 * level;
    scoreEl.textContent = score;
    soundEat();
    foodCount++;
    ate = true;

    const newLevel = Math.floor(score / 100) + 1;
    if (newLevel > level) {
      level = newLevel;
      levelEl.textContent = level;
      soundLevelUp();
      showLevelFlash();
      clearInterval(gameLoop);
      const speed = Math.max(45, getBaseSpeed() - (level - 1) * 10);
      gameLoop = setInterval(tick, speed);
    }

    food = randCell();

    if (!bossFood && foodCount % BOSS_EVERY === 0) {
      spawnBossFood();
    }
  }

  /* --- eat boss food --- */
  if (bossFood && head.x === bossFood.x && head.y === bossFood.y) {
    const pts = 30 * level;
    score += pts;
    scoreEl.textContent = score;
    soundBossEat();
    hideBossAlert();
    showBossEatFlash(pts);
    bossFood = null;
    ate = true;
  }

  if (!ate) snake.pop();

  /* --- boss food tick --- */
  if (bossFood) {
    bossAngle += 0.18;
    bossLifetime--;
    bossTick++;
    if (bossTick % BOSS_MOVE_EVERY === 0) moveBossFood();
    if (bossLifetime <= 0) {
      soundBossExpire();
      hideBossAlert();
      bossFood = null;
    }
  }

  draw();
}

/* ===================== LEVEL FLASH ===================== */
function showLevelFlash() {
  levelFlash.textContent = `⬆️ ระดับ ${level}!`;
  levelFlash.style.color = '#ffd04e';
  levelFlash.style.textShadow = '0 0 20px #ffd04e';
  levelFlash.style.opacity = '1';
  setTimeout(() => { levelFlash.style.opacity = '0'; }, 900);
}

function showBossEatFlash(pts) {
  levelFlash.textContent = `👑 +${pts} บอส!`;
  levelFlash.style.color = '#ff9900';
  levelFlash.style.textShadow = '0 0 24px #ff9900';
  levelFlash.style.opacity = '1';
  setTimeout(() => { levelFlash.style.opacity = '0'; }, 1100);
}

/* ===================== DRAW ===================== */
function draw() {
  const st = selectedStage;
  ctx.fillStyle = st.bgColor;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  drawGrid(st.gridColor);
  drawObstacles(st);
  drawFood(st);
  if (bossFood) drawBossFood();
  drawSnake(st);
}

function drawGrid(color) {
  ctx.strokeStyle = color;
  ctx.lineWidth = 0.5;
  for (let x = 0; x <= COLS; x++) {
    ctx.beginPath(); ctx.moveTo(x*CELL,0); ctx.lineTo(x*CELL,canvas.height); ctx.stroke();
  }
  for (let y = 0; y <= ROWS; y++) {
    ctx.beginPath(); ctx.moveTo(0,y*CELL); ctx.lineTo(canvas.width,y*CELL); ctx.stroke();
  }
}

function drawObstacles(st) {
  if (!st.wallColor) return;
  currentObstacles.forEach(o => {
    ctx.fillStyle = st.wallColor;
    ctx.shadowBlur = 6;
    ctx.shadowColor = st.wallColor;
    ctx.beginPath();
    ctx.roundRect(o.x*CELL+1, o.y*CELL+1, CELL-2, CELL-2, 3);
    ctx.fill();
    ctx.shadowBlur = 0;

    ctx.strokeStyle = adjustColor(st.wallColor, 60);
    ctx.lineWidth = 1;
    ctx.stroke();
  });
}

function drawFood(st) {
  ctx.fillStyle = st.foodColor;
  ctx.shadowBlur = 14;
  ctx.shadowColor = st.foodColor;
  ctx.beginPath();
  ctx.arc(food.x*CELL+CELL/2, food.y*CELL+CELL/2, CELL/2-3, 0, Math.PI*2);
  ctx.fill();
  ctx.shadowBlur = 0;
}

function drawBossFood() {
  const cx = bossFood.x * CELL + CELL / 2;
  const cy = bossFood.y * CELL + CELL / 2;
  const pulse = 0.85 + 0.15 * Math.sin(bossAngle);
  const r = (CELL / 2 - 1) * pulse;

  /* timer arc behind boss */
  const lifeFrac = bossLifetime / BOSS_LIFE;
  ctx.strokeStyle = lifeFrac > 0.4 ? '#ff9900' : '#ff3333';
  ctx.lineWidth = 2.5;
  ctx.shadowBlur = 0;
  ctx.beginPath();
  ctx.arc(cx, cy, r + 2, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * lifeFrac);
  ctx.stroke();

  /* glowing background */
  const glowSize = 18 + 8 * Math.sin(bossAngle);
  ctx.shadowBlur = glowSize;
  ctx.shadowColor = '#ff9900';
  ctx.fillStyle = '#cc5500';
  ctx.beginPath();
  ctx.arc(cx, cy, r - 2, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;

  /* star shape */
  drawStar(cx, cy, 5, r - 3, (r - 3) * 0.45, bossAngle * 0.4);

  /* crown emoji label */
  ctx.fillStyle = '#fff';
  ctx.font = `bold ${Math.floor(CELL * 0.42)}px serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.shadowBlur = 8;
  ctx.shadowColor = '#ff9900';
  ctx.fillText('👑', cx, cy);
  ctx.shadowBlur = 0;

  /* x3 badge */
  ctx.font = `bold ${Math.floor(CELL * 0.3)}px sans-serif`;
  ctx.fillStyle = '#ffff00';
  ctx.shadowColor = '#ffaa00';
  ctx.shadowBlur = 6;
  ctx.fillText('x3', cx + r * 0.55, cy - r * 0.55);
  ctx.shadowBlur = 0;
  ctx.textBaseline = 'alphabetic';
}

function drawStar(cx, cy, spikes, outerR, innerR, rotation) {
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(rotation);
  ctx.beginPath();
  for (let i = 0; i < spikes * 2; i++) {
    const angle = (i * Math.PI) / spikes - Math.PI / 2;
    const r = i % 2 === 0 ? outerR : innerR;
    if (i === 0) ctx.moveTo(Math.cos(angle)*r, Math.sin(angle)*r);
    else ctx.lineTo(Math.cos(angle)*r, Math.sin(angle)*r);
  }
  ctx.closePath();
  ctx.fillStyle = 'rgba(255,180,0,0.25)';
  ctx.fill();
  ctx.restore();
}

function drawSnake(st) {
  const [r,g,b] = st.snakeBody;
  snake.forEach((seg, i) => {
    const ratio = 1 - i / snake.length;
    const cr = Math.floor(r * (0.5 + 0.5 * ratio));
    const cg = Math.floor(g * (0.4 + 0.6 * ratio));
    const cb = Math.floor(b * (0.4 + 0.6 * ratio));
    ctx.fillStyle = i === 0 ? st.snakeHead : `rgb(${cr},${cg},${cb})`;
    ctx.shadowBlur = i === 0 ? 16 : 0;
    ctx.shadowColor = st.snakeHead;
    const pad = i === 0 ? 1 : 2;
    ctx.beginPath();
    ctx.roundRect(seg.x*CELL+pad, seg.y*CELL+pad, CELL-pad*2, CELL-pad*2, i === 0 ? 6 : 4);
    ctx.fill();
    ctx.shadowBlur = 0;
  });

  if (snake.length > 0) {
    const head = snake[0];
    ctx.fillStyle = '#0f0f1a';
    const eo = CELL * 0.22, er = CELL * 0.1;
    const cx = head.x*CELL+CELL/2, cy = head.y*CELL+CELL/2;
    let e1, e2;
    if      (dir.x === 1)  { e1=[cx+eo,cy-eo]; e2=[cx+eo,cy+eo]; }
    else if (dir.x === -1) { e1=[cx-eo,cy-eo]; e2=[cx-eo,cy+eo]; }
    else if (dir.y === -1) { e1=[cx-eo,cy-eo]; e2=[cx+eo,cy-eo]; }
    else                   { e1=[cx-eo,cy+eo]; e2=[cx+eo,cy+eo]; }
    [e1,e2].forEach(([ex,ey]) => {
      ctx.beginPath(); ctx.arc(ex,ey,er,0,Math.PI*2); ctx.fill();
    });
  }
}

function adjustColor(hex, amount) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return `rgb(${Math.min(255,r+amount)},${Math.min(255,g+amount)},${Math.min(255,b+amount)})`;
}

/* ===================== INPUT ===================== */
document.addEventListener('keydown', e => {
  switch (e.key) {
    case 'ArrowUp':    case 'w': case 'W': if (dir.y !== 1)  nextDir={x:0,y:-1}; break;
    case 'ArrowDown':  case 's': case 'S': if (dir.y !== -1) nextDir={x:0,y: 1}; break;
    case 'ArrowLeft':  case 'a': case 'A': if (dir.x !== 1)  nextDir={x:-1,y:0}; break;
    case 'ArrowRight': case 'd': case 'D': if (dir.x !== -1) nextDir={x: 1,y:0}; break;
  }
});

document.getElementById('ctrl-up').addEventListener('click',    () => { if(dir.y!== 1) nextDir={x:0,y:-1}; });
document.getElementById('ctrl-down').addEventListener('click',  () => { if(dir.y!==-1) nextDir={x:0,y: 1}; });
document.getElementById('ctrl-left').addEventListener('click',  () => { if(dir.x!== 1) nextDir={x:-1,y:0}; });
document.getElementById('ctrl-right').addEventListener('click', () => { if(dir.x!==-1) nextDir={x: 1,y:0}; });

retryBtn.addEventListener('click', () => { soundSelect(); startGame(); });
backBtn.addEventListener('click',  () => { soundSelect(); showStageSelect(); });

muteBtn.addEventListener('click', () => {
  muted = !muted;
  muteBtn.textContent = muted ? '🔇' : '🔊';
});

/* ===================== BOOT ===================== */
updateGlobalHigh();
showStageSelect();

// Draw initial preview
(function() {
  const mid = Math.floor(COLS/2);
  snake = [{x:mid,y:mid},{x:mid-1,y:mid},{x:mid-2,y:mid}];
  dir={x:1,y:0}; nextDir={x:1,y:0};
  currentObstacles = [];
  food={x:mid+3,y:mid};
  draw();
})();
</script>
